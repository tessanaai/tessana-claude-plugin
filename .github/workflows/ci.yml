name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests (mock Tessana API)
        run: node --test
      - name: Validate marketplace and plugin manifests
        run: |
          npx -y @anthropic-ai/claude-code plugin validate .
          npx -y @anthropic-ai/claude-code plugin validate plugins/tessana
